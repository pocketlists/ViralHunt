l<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral Hunt Pro</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f0f13; color: #ffffff; margin: 0; padding: 20px; }
        .container { max-width: 950px; margin: auto; }
        h1 { color: #00e676; margin-bottom: 5px; }
        .card { background: #1c1c24; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #2d2d3b; }
        input, button { padding: 12px; margin: 5px 0; border-radius: 6px; border: 1px solid #333; background: #0f0f13; color: white; box-sizing: border-box; }
        button { background: #00e676; color: #000; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #00c853; }
        
        .table-responsive { overflow-x: auto; background: #1c1c24; border-radius: 10px; border: 1px solid #2d2d3b; }
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #2d2d3b; }
        th { background: #2d2d3b; color: #a0a0a0; }
        
        /* Thumbnails & Links */
        .thumb-img { border-radius: 8px; width: 140px; display: block; }
        .watch-link { color: #00e676; text-decoration: none; font-weight: bold; }
        .watch-link:hover { text-decoration: underline; }
        
        .modal { display: none; position: fixed; top: 10%; left: 10%; width: 80%; height: 80%; background: #1c1c24; padding: 20px; border-radius: 10px; border: 2px solid #00e676; z-index: 100; }
        #status { margin: 15px 0; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Viral Hunt Pro</h1>
        
        <input type="password" id="ytKey" placeholder="🔑 Paste your YouTube API Key here..." style="width: 100%;">
        
        <div style="display: flex; gap: 10px;">
            <input type="text" id="query" placeholder="🔍 Enter topic (e.g., anime recap)" style="flex: 2;">
            <input type="number" id="maxSubs" value="5000" placeholder="Max Subs" style="flex: 1;">
            <button onclick="startHunting()" id="huntBtn" style="flex: 1;">Start Hunting ⚡</button>
        </div>

        <div id="status"></div>
        
        <div class="table-responsive" id="tableContainer" style="display: none;">
            <table>
                <thead>
                    <tr>
                        <th>Thumbnail</th>
                        <th>Video Title</th>
                        <th>Subs</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Script Editor Modal -->
    <div id="scriptModal" class="modal">
        <button onclick="closePanel()" style="background:#ff4444; color:white; width: auto;">❌ Close</button>
        <h3 id="modalTitle" style="color: #00e676;">Transcript Extractor</h3>
        <button onclick="fetchAutoTranscript()">⬇️ Fetch Transcript Automatically</button>
        <textarea id="transcriptInput" rows="15" style="width: 100%; margin-top: 10px; background: #000; color: #fff;"></textarea>
    </div>

    <script>
        window.onload = () => { document.getElementById('ytKey').value = localStorage.getItem('ytKey') || ''; };
        let currentVidId = "";

        async function startHunting() {
            const ytKey = document.getElementById('ytKey').value.trim();
            localStorage.setItem('ytKey', ytKey);
            const query = document.getElementById('query').value.trim();
            const maxSubs = parseInt(document.getElementById('maxSubs').value) || 5000;
            const statusBox = document.getElementById('status');
            const tableBody = document.getElementById('tableBody');
            const tableContainer = document.getElementById('tableContainer');

            if (!ytKey || !query) { statusBox.innerHTML = "⚠️ API Key aur Topic daalo!"; return; }

            statusBox.innerHTML = "🔍 Hunting (Filtering Shorts)...";
            tableBody.innerHTML = "";
            tableContainer.style.display = "none";

            try {
                let yesterday = new Date(new Date().getTime() - (24 * 60 * 60 * 1000));
                // videoDuration=long filters out Shorts
                const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=50&order=viewCount&videoDuration=long&publishedAfter=${yesterday.toISOString()}&q=${encodeURIComponent(query)}&key=${ytKey}`);
                const data = await res.json();

                let channelIds = data.items.map(v => v.snippet.channelId).join(',');
                const chRes = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${channelIds}&key=${ytKey}`);
                const chData = await chRes.json();
                let stats = {};
                chData.items.forEach(c => stats[c.id] = parseInt(c.statistics.subscriberCount) || 0);

                for (let v of data.items) {
                    let subs = stats[v.snippet.channelId];
                    if (subs <= maxSubs) {
                        tableContainer.style.display = "table";
                        let vidId = v.id.videoId;
                        tableBody.innerHTML += `<tr>
                            <td><a href="https://www.youtube.com/watch?v=${vidId}" target="_blank"><img class="thumb-img" src="${v.snippet.thumbnails.medium.url}"></a></td>
                            <td>
                                <a href="https://www.youtube.com/watch?v=${vidId}" target="_blank" style="color:white; text-decoration:none;">${v.snippet.title}</a>
                                <br><small style="color:#a0a0a0">${v.snippet.channelTitle}</small>
                            </td>
                            <td style="color:#00e676; font-weight:bold;">${subs.toLocaleString()}</td>
                            <td><button onclick="openPanel('${vidId}', '${v.snippet.title.replace(/'/g, "\\'")}')">📝 Transcript</button></td>
                        </tr>`;
                    }
                }
                statusBox.innerHTML = "✅ Hunt Complete!";
            } catch(e) { statusBox.innerHTML = "❌ Error: " + e.message; }
        }

        function openPanel(id, title) { currentVidId = id; document.getElementById('modalTitle').innerText = title; document.getElementById('scriptModal').style.display = 'block'; }
        function closePanel() { document.getElementById('scriptModal').style.display = 'none'; }

        async function fetchAutoTranscript() {
            const input = document.getElementById('transcriptInput');
            input.value = "⏳ Fetching...";
            try {
                const res = await fetch(`https://pipedapi.kavin.rocks/streams/${currentVidId}`);
                const data = await res.json();
                let sub = data.subtitles.find(s => s.code.startsWith('en')) || data.subtitles[0];
                const subRes = await fetch(sub.url);
                const subText = await subRes.text();
                input.value = subText.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
            } catch(e) { input.value = "⚠️ Transcript nahi mili."; }
        }
    </script>
</body>
</html>
