    <script>
        async function getTranscript() {
            const rapidKey = document.getElementById('rapidKey').value.trim();
            let rawInput = document.getElementById('vidId').value.trim();
            const output = document.getElementById('output');
            const btn = document.getElementById('btn');

            if(!rapidKey || !rawInput) {
                output.innerHTML = "<span style='color:#ff4444;'>⚠️ Bhai, API Key aur Link dono daalna zaroori hai!</span>";
                return;
            }

            // SMART FILTER: Video ID Extract Karna
            let vidId = rawInput;
            let match = rawInput.match(/(?:youtu\.be\/|youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
            if (match && match[1]) {
                vidId = match[1]; 
            }

            btn.innerText = "Extracting Script... ⏳";
            btn.style.opacity = "0.7";
            output.innerHTML = `Subtitles fetch kar raha hu... ID: <b>${vidId}</b>`;

            const url = `https://youtube-transcript3.p.rapidapi.com/api/transcript-with-metadata?videoId=${vidId}&lang=en`;
            
            const options = {
                method: 'GET',
                headers: {
                    'X-RapidAPI-Key': rapidKey,
                    'X-RapidAPI-Host': 'youtube-transcript3.p.rapidapi.com'
                }
            };

            try {
                const response = await fetch(url, options);
                const data = await response.json();

                // 🪄 MAGIC FIX: Asli Error Pakadne Wala Logic
                if (data.message) {
                    // Agar RapidAPI block kar raha hai
                    output.innerHTML = `<span style='color:#ffbb33;'>⚠️ <b>RapidAPI Error:</b> ${data.message} <br><br>👉 <b>Solution:</b> Shayad tumne RapidAPI ki website par is API ke liye 'Subscribe to Test' (Free Plan) par click nahi kiya hai.</span>`;
                } 
                else if (data && data.transcript && data.transcript.length > 0) {
                    // Agar success ho gaya
                    let fullText = data.transcript.map(item => item.text).join(' ');
                    output.innerHTML = `
                        <p style="color:#00e676; font-weight:bold;">✅ Script Extracted Successfully!</p>
                        <p>${fullText}</p>
                    `;
                } 
                else {
                    // Agar API koi ajeeb data bhej rahi hai
                    output.innerHTML = `<span style='color:#ffbb33;'>⚠️ API ne script nahi di, balki yeh code bheja hai:<br><br> <code style="color:#fff; background:#000; padding:5px;">${JSON.stringify(data)}</code></span>`;
                }
            } catch (error) {
                output.innerHTML = `<span style='color:#ff4444;'>❌ System Error: ${error.message}</span>`;
            }

            btn.innerText = "Extract Script ⚡";
            btn.style.opacity = "1";
        }
    </script>
