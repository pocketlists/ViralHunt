<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Auto-Script Hack</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f0f13; color: #fff; padding: 20px; }
        .box { background: #1c1c24; padding: 20px; border-radius: 10px; max-width: 500px; margin: auto; border: 1px solid #2d2d3b; }
        input, button { padding: 12px; margin: 10px 0; width: 100%; box-sizing: border-box; border-radius: 6px; }
        input { background: #0f0f13; border: 1px solid #333; color: white; font-size: 1rem; }
        button { background: #00e676; border: none; color: black; font-weight: bold; font-size: 1rem; cursor: pointer; }
        button:hover { background: #00c853; }
        #output { margin-top: 20px; background: #0f0f13; padding: 15px; border-radius: 6px; max-height: 400px; overflow-y: auto; border: 1px solid #333; font-size: 0.95em; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="box">
        <h2 style="color: #00e676; text-align: center;">⚡ Ultimate Script Hack</h2>
        <p style="color: #a0a0a0; text-align: center; font-size: 0.9em;">(Powered by Free Open-Source API)</p>
        
        <input type="text" id="vidInput" placeholder="Paste Full YouTube Link Here...">
        <button onclick="extractScript()" id="extractBtn">Hack Transcript 😈</button>

        <div id="output">Transcript yahan aayegi...</div>
    </div>

    <script>
        async function extractScript() {
            const inputVal = document.getElementById('vidInput').value.trim();
            const output = document.getElementById('output');
            const extractBtn = document.getElementById('extractBtn');

            if(!inputVal) {
                output.innerHTML = "<span style='color:red;'>⚠️ Pehle Link daalo bhai!</span>";
                return;
            }

            // SMART EXTRACTOR
            let videoId = null;
            let match = inputVal.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))((\w|-){11})/);
            if (match && match[1]) {
                videoId = match[1];
            } else if (inputVal.length === 11) {
                videoId = inputVal;
            }

            if (!videoId) {
                output.innerHTML = "<span style='color:red;'>⚠️ Sahi YouTube Link daalo!</span>";
                return;
            }

            extractBtn.disabled = true;
            extractBtn.innerText = "Extracting Script... ⏳";
            output.innerHTML = "<p style='color: #a0a0a0;'>1/2: Connecting to Open-Source API...</p>";

            try {
                // STEP 1: Piped API se video details nikalna
                const apiUrl = `https://pipedapi.kavin.rocks/streams/${videoId}`;
                let response = await fetch(apiUrl);
                let data = await response.json();

                if (!data.subtitles || data.subtitles.length === 0) {
                    throw new Error("Bhai, is video par sach mein koi subtitles (CC) nahi hain. Koi aisi video try karo jisme CC ka option ho.");
                }

                output.innerHTML += "<p style='color: #a0a0a0;'>2/2: Script mil gayi, saaf kar raha hu...</p>";

                // Sabse pehli subtitle file (zyadatar Auto-generated ya English) uthana
                let subUrl = data.subtitles[0].url;

                // STEP 2: Subtitle text (VTT format) download karna
                let subResponse = await fetch(subUrl);
                let vttText = await subResponse.text();

                // STEP 3: VTT File ko clean karke normal text banana (Timestamps aur code hatana)
                let cleanText = vttText
                    .replace(/WEBVTT[\s\S]*?(?=\d{2}:\d{2}:\d{2})/g, '') // Shuru ka kachra hatana
                    .replace(/\d{2}:\d{2}:\d{2}.*?\n/g, '') // Timestamps hatana
                    .replace(/<[^>]+>/g, '') // HTML tags hatana
                    .replace(/\n+/g, ' ') // Lines ko jodna
                    .trim();

                output.innerHTML = `<h3 style="color:#00e676;">✅ Script Hunt Successful!</h3>
                                    <p style="color:white;">${cleanText}</p>`;

            } catch (error) {
                output.innerHTML = `<p style="color:#ff4444;">❌ Error: ${error.message}</p>`;
            }

            extractBtn.disabled = false;
            extractBtn.innerText = "Hack Transcript 😈";
        }
    </script>
</body>
</html>
